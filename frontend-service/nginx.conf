server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Chuyển hướng tất cả các đường dẫn về index.html
        try_files $uri /index.html;
    }

    # Tùy chọn: Cấu hình để phục vụ các tệp tĩnh
    location ~* \.(?:ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|otf|eot|ttc|mp4|webm|ogg|mp3|wav|avi|mov|flv|m4a|m4v|pdf|txt)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}